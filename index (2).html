<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>손맛분식 - 고객응대 챗봇</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Noto Sans KR Font -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar & styling */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fff7ed;
        }
        ::-webkit-scrollbar-thumb {
            background: #fdba74;
            border-radius: 9999px;
        }
        .chat-bubble-shadow {
            box-shadow: 0 2px 8px -2px rgba(234, 88, 12, 0.12);
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="bg-amber-50/60 font-sans text-slate-800 antialiased flex flex-col justify-center min-h-screen sm:py-4">

    <!-- App Container -->
    <div class="w-full max-w-md mx-auto bg-white sm:rounded-3xl shadow-xl flex flex-col h-[100vh] sm:h-[840px] overflow-hidden border border-orange-100 relative">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-brand-600 via-brand-500 to-amber-500 text-white p-4 sm:p-5 shadow-md shrink-0 relative z-10">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-11 h-11 bg-white/20 backdrop-blur-md rounded-2xl flex items-center justify-center text-2xl border border-white/30 shadow-inner">
                        🍲
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h1 class="text-xl font-extrabold tracking-tight">손맛분식</h1>
                            <span class="bg-white/20 text-xs px-2 py-0.5 rounded-full font-medium border border-white/30">달빛시장</span>
                        </div>
                        <p class="text-xs text-orange-100 mt-0.5 flex items-center gap-1">
                            <span>📍 달빛시장 3번 골목</span>
                        </p>
                    </div>
                </div>
                <!-- Status Badge -->
                <div class="text-right">
                    <span id="openStatusBadge" class="inline-flex items-center gap-1 text-[11px] bg-emerald-500/90 text-white px-2.5 py-1 rounded-full font-medium shadow-sm">
                        <span class="w-1.5 h-1.5 bg-white rounded-full animate-ping"></span>
                        영업 중
                    </span>
                </div>
            </div>

            <!-- Business Info Card -->
            <div class="mt-3.5 bg-black/10 backdrop-blur-sm rounded-xl p-2.5 text-xs text-orange-50 flex items-center justify-between border border-white/10">
                <div class="flex items-center gap-1.5">
                    <svg class="w-4 h-4 text-orange-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span><strong>운영시간:</strong> 평일 10~20시 / 토 10~21시</span>
                </div>
                <span class="text-orange-200 font-semibold">(일요일 휴무)</span>
            </div>
        </header>

        <!-- Chat History Area -->
        <main id="chatBox" class="flex-1 p-4 overflow-y-auto space-y-4 bg-gradient-to-b from-orange-50/50 to-amber-50/20">
            
            <!-- Bot Greeting Message -->
            <div class="flex items-start gap-2.5 animate-fade-in">
                <div class="w-8 h-8 rounded-full bg-brand-500 text-white flex items-center justify-center text-sm font-bold shadow-sm shrink-0">
                    손
                </div>
                <div class="max-w-[82%]">
                    <div class="bg-white p-3.5 rounded-2xl rounded-tl-none border border-orange-100 text-sm text-slate-700 chat-bubble-shadow space-y-2">
                        <p class="font-bold text-brand-700">안녕하세요! 정이 넘치는 손맛분식입니다. 😊</p>
                        <p>궁금한 점을 아래에서 선택하시거나 직접 물어봐 주세요!</p>
                    </div>
                    <span class="text-[10px] text-slate-400 mt-1 block pl-1">방금 전</span>
                </div>
            </div>

            <!-- Quick FAQ Buttons Section -->
            <div class="bg-white/80 backdrop-blur-sm p-3.5 rounded-2xl border border-orange-200/80 my-2 shadow-sm animate-fade-in">
                <p class="text-xs font-bold text-slate-500 mb-2.5 flex items-center gap-1">
                    💡 <span>자주 묻는 질문 (빠른 확인)</span>
                </p>
                <div class="grid grid-cols-2 gap-2">
                    <button onclick="askQuickQuestion('영업시간')" class="text-left bg-orange-50 hover:bg-brand-500 hover:text-white text-brand-800 text-xs py-2 px-3 rounded-xl font-medium transition-all duration-200 border border-orange-200/60 flex items-center justify-between group">
                        <span>🕒 영업시간</span>
                        <span class="opacity-0 group-hover:opacity-100 transition-opacity">→</span>
                    </button>
                    <button onclick="askQuickQuestion('대표 메뉴')" class="text-left bg-orange-50 hover:bg-brand-500 hover:text-white text-brand-800 text-xs py-2 px-3 rounded-xl font-medium transition-all duration-200 border border-orange-200/60 flex items-center justify-between group">
                        <span>🥘 대표 메뉴</span>
                        <span class="opacity-0 group-hover:opacity-100 transition-opacity">→</span>
                    </button>
                    <button onclick="askQuickQuestion('위치가 어디인가요?')" class="text-left bg-orange-50 hover:bg-brand-500 hover:text-white text-brand-800 text-xs py-2 px-3 rounded-xl font-medium transition-all duration-200 border border-orange-200/60 flex items-center justify-between group">
                        <span>📍 위치 및 길안내</span>
                        <span class="opacity-0 group-hover:opacity-100 transition-opacity">→</span>
                    </button>
                    <button onclick="askQuickQuestion('카드 결제되나요?')" class="text-left bg-orange-50 hover:bg-brand-500 hover:text-white text-brand-800 text-xs py-2 px-3 rounded-xl font-medium transition-all duration-200 border border-orange-200/60 flex items-center justify-between group">
                        <span>💳 결제 및 상품권</span>
                        <span class="opacity-0 group-hover:opacity-100 transition-opacity">→</span>
                    </button>
                </div>
            </div>

        </main>

        <!-- Footer Input Bar -->
        <footer class="p-3 bg-white border-t border-orange-100 shrink-0">
            <form id="chatForm" onsubmit="handleFormSubmit(event)" class="flex items-center gap-2">
                <input 
                    type="text" 
                    id="userInput" 
                    placeholder="질문을 입력하세요 (예: 포장 가능한가요?)" 
                    class="flex-1 bg-amber-50/50 border border-orange-200 text-slate-800 text-sm rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:bg-white transition-all placeholder-slate-400"
                    autocomplete="off"
                />
                <button 
                    type="submit" 
                    class="bg-brand-500 hover:bg-brand-600 active:scale-95 text-white p-3 rounded-xl transition-all shadow-md flex items-center justify-center shrink-0"
                    aria-label="전송"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                    </svg>
                </button>
            </form>
            <div class="text-center mt-2">
                <p class="text-[10px] text-slate-400">손맛분식 안내 챗봇 서비스 • 달빛시장 3번 골목</p>
            </div>
        </footer>

    </div>

    <script>
        /**
         * 10가지 전용 FAQ 데이터베이스 (지정된 규격에 맞춤)
         */
        const faqDatabase = [
            {
                keywords: ["몇시", "몇 시", "언제까지", "영업시간", "영업 시간", "닫나요", "열나요", "시간", "쉬는날", "휴무", "일요일", "토요일", "평일"],
                answer: "평일은 10시부터 20시까지, 토요일은 21시까지입니다. 일요일은 쉽니다."
            },
            {
                keywords: ["대표", "인기", "추천", "메뉴", "제일", "떡볶이", "튀김", "순대", "뭐가"],
                answer: "쌀떡볶이(4,000원)와 수제 튀김 모듬(5,000원), 순대(4,500원)가 대표 인기 메뉴입니다."
            },
            {
                keywords: ["위치", "어디", "어떻게", "찾아가", "길", "약도", "주소", "골목"],
                answer: "달빛시장 메인 거리로 들어오셔서 3번 골목 안쪽으로 20m 오시면 주황색 간판의 '손맛분식'이 있습니다."
            },
            {
                keywords: ["포장", "테이크아웃", "싸가", "싸갈"],
                answer: "네, 모든 메뉴 포장 가능합니다. 국물이나 튀김도 정성껏 깔끔하게 포장해 드립니다."
            },
            {
                keywords: ["카드", "제로페이", "온누리", "상품권", "결제", "지역사랑", "계좌이체", "현금"],
                answer: "신용카드, 온누리상품권, 제로페이, 지역사랑상품권, 계좌이체 모두 가능합니다."
            },
            {
                keywords: ["주차", "주차장", "차", "공영주차장", "주차권"],
                answer: "달빛시장 공영주차장을 이용하시면 됩니다. 1만원 이상 구매 시 1시간 무료 주차권을 드립니다."
            },
            {
                keywords: ["자리", "먹고", "매장", "식사", "테이블", "좌석", "앉아"],
                answer: "네, 매장 안에 12명 정도 앉아서 드실 수 있는 아늑한 테이블 공간이 마련되어 있습니다."
            },
            {
                keywords: ["배달", "배민", "배달의민족", "주문"],
                answer: "인근 지역은 배달의민족 앱을 통해 주문 가능하시며, 전화 예약 후 픽업도 가능합니다."
            },
            {
                keywords: ["단체", "예약", "단체주문", "간식", "학교", "학원"],
                answer: "네, 야유회나 학교/학원 간식 단체 주문 가능합니다. 최소 하루 전에 전화 주시면 감사하겠습니다."
            },
            {
                keywords: ["매운", "맵", "맵기", "아이", "초등학생", "달콤"],
                answer: "초등학생도 맛있게 먹을 수 있는 매콤달콤한 옛날 학교 앞 떡볶이 맛입니다!"
            }
        ];

        const DEFAULT_FALLBACK_ANSWER = "확인이 어렵습니다. 사장님께 직접 여쭤봐 주세요";

        /**
         * 입력 문장에서 최적의 FAQ 답안 검색 (매칭 점수 기반)
         */
        function findBestAnswer(userText) {
            const cleanText = userText.trim().toLowerCase().replace(/[?\s!.,]/g, '');
            if (!cleanText) return DEFAULT_FALLBACK_ANSWER;

            let bestMatchIndex = -1;
            let maxScore = 0;

            faqDatabase.forEach((item, index) => {
                let currentScore = 0;
                item.keywords.forEach(keyword => {
                    const cleanKeyword = keyword.toLowerCase().replace(/\s/g, '');
                    if (cleanText.includes(cleanKeyword)) {
                        // 키워드 길이에 따른 가중치 부여
                        currentScore += cleanKeyword.length;
                    }
                });

                if (currentScore > maxScore) {
                    maxScore = currentScore;
                    bestMatchIndex = index;
                }
            });

            if (bestMatchIndex !== -1 && maxScore >= 1) {
                return faqDatabase[bestMatchIndex].answer;
            }

            return DEFAULT_FALLBACK_ANSWER;
        }

        /**
         * 화면에 사용자 메시지 추가
         */
        function addUserMessage(text) {
            const chatBox = document.getElementById('chatBox');
            const now = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            
            const messageHTML = `
                <div class="flex items-start justify-end gap-2.5 animate-fade-in">
                    <div class="max-w-[82%] text-right">
                        <div class="bg-brand-500 text-white p-3.5 rounded-2xl rounded-tr-none text-sm font-medium shadow-sm inline-block text-left">
                            ${escapeHTML(text)}
                        </div>
                        <span class="text-[10px] text-slate-400 mt-1 block pr-1">${now}</span>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', messageHTML);
            scrollToBottom();
        }

        /**
         * 화면에 봇 답변 추가
         */
        function addBotMessage(text) {
            const chatBox = document.getElementById('chatBox');
            const now = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
            
            const messageHTML = `
                <div class="flex items-start gap-2.5 animate-fade-in">
                    <div class="w-8 h-8 rounded-full bg-brand-500 text-white flex items-center justify-center text-sm font-bold shadow-sm shrink-0">
                        손
                    </div>
                    <div class="max-w-[82%]">
                        <div class="bg-white p-3.5 rounded-2xl rounded-tl-none border border-orange-100 text-sm text-slate-800 chat-bubble-shadow">
                            ${escapeHTML(text)}
                        </div>
                        <span class="text-[10px] text-slate-400 mt-1 block pl-1">${now}</span>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', messageHTML);
            scrollToBottom();
        }

        /**
         * 폼 제출 이벤트 처리
         */
        function handleFormSubmit(event) {
            event.preventDefault();
            const inputEl = document.getElementById('userInput');
            const question = inputEl.value.trim();

            if (!question) return;

            // 1. 사용자 질문 출력
            addUserMessage(question);
            inputEl.value = '';

            // 2. 답변 찾기 및 출력 (딜레이 효과 추가)
            setTimeout(() => {
                const answer = findBestAnswer(question);
                addBotMessage(answer);
            }, 250);
        }

        /**
         * 빠른 질문 버튼 클릭 시
         */
        function askQuickQuestion(questionText) {
            addUserMessage(questionText);
            setTimeout(() => {
                const answer = findBestAnswer(questionText);
                addBotMessage(answer);
            }, 250);
        }

        /**
         * 스크롤을 맨 아래로 이동
         */
        function scrollToBottom() {
            const chatBox = document.getElementById('chatBox');
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        /**
         * XSS 방지용 문자열 이스케이프
         */
        function escapeHTML(str) {
            return str
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
